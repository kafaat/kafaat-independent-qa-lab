<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA Field Inspection</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f8f9f9; color: #172a33; }
  main { max-width: 60rem; margin-inline: auto; padding: 1rem; }
  .panel { background: white; padding: 1.5rem; border: 1px solid #cbd5e1; }
  button { color: white; background: #164b5c; padding: .75rem 1rem; }
</style>
</head>
<body>
  <main>
    <h1>Field Details</h1>
    <section class="panel" aria-label="Field inspection">
      <img src="field-preview.svg" alt="Satellite preview of the selected field">
      <button type="button">Save</button>
    </section>
  </main>
</body>
</html>
