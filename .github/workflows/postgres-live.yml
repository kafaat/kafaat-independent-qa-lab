name: PostgreSQL live integration
on:
  push:
    branches: ['feat/postgres-worker-integration']
  pull_request:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: qa-ci-only
          POSTGRES_DB: qa_lab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qa -d qa_lab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      QA_TEST_POSTGRES_DSN: postgresql://qa:qa-ci-only@127.0.0.1:5432/qa_lab_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL driver
        run: python -m pip install 'psycopg[binary]>=3,<4'
      - name: Run real database integration tests
        run: |
          PYTHONPATH=. python -W error::ResourceWarning -m unittest discover -s tests -p 'test_pg_queue_live.py' -v
      - name: Verify child process exit recovery
        run: PYTHONPATH=. python -W error::ResourceWarning -m unittest discover -s tests -p 'test_pg_process_recovery.py' -v
      - name: Verify SIGKILL worker recovery
        run: PYTHONPATH=. python -W error::ResourceWarning -m unittest discover -s tests -p 'test_pg_sigkill_recovery.py' -v
      - name: Verify API contract to PostgreSQL worker flow
        run: PYTHONPATH=. python -W error::ResourceWarning -m unittest discover -s tests -p 'test_pg_service_flow.py' -v
      - name: Verify HTTP to separate worker process
        run: PYTHONPATH=. python -W error::ResourceWarning -m unittest discover -s tests -p 'test_pg_http_worker_flow.py' -v
      - name: Reject skipped integration tests
        run: |
          python - <<'PY'
          import os
          if not os.environ.get('QA_TEST_POSTGRES_DSN'):
              raise SystemExit('Missing real PostgreSQL test DSN')
          PY
