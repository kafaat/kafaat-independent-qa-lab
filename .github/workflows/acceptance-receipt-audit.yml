name: Acceptance receipt audit
on:
  pull_request:
    paths:
      - 'qa_lab/acceptance_receipt_audit.py'
      - 'tests/test_acceptance_receipt_audit.py'
      - '.github/workflows/acceptance-receipt-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  receipt-audit-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m py_compile qa_lab/acceptance_receipt_audit.py tests/test_acceptance_receipt_audit.py
      - run: python -m unittest discover -s tests -p 'test_acceptance_receipt_audit.py' -v
