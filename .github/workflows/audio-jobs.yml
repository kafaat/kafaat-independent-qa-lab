name: Bounded audio job acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-http:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Bounded data contracts, worker, real HTTP; no skips
        run: |
          PYTHONPATH=. python -W error::ResourceWarning - <<'PY'
          import gc, sys, unittest
          errors = []
          sys.unraisablehook = lambda e: errors.append(type(e.exc_value).__name__)
          result = unittest.TextTestRunner(verbosity=2).run(
              unittest.defaultTestLoader.discover('tests', pattern='test_audio_jobs.py'))
          gc.collect()
          if not result.wasSuccessful() or result.skipped or errors or result.testsRun != 43:
              raise SystemExit('Incomplete bounded audio job validation')
          PY
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: ci-only-disposable
          POSTGRES_DB: qa_audio_jobs_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qa -d qa_audio_jobs_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      QA_TEST_POSTGRES_DSN: postgresql://qa:ci-only-disposable@127.0.0.1:5432/qa_audio_jobs_test
      QA_NATS_URL: nats://127.0.0.1:4222
      QA_AUDIO_LIVE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install 'psycopg[binary]>=3,<4' 'nats-py>=2.7,<3'
      - name: Start dedicated JetStream
        run: |
          docker run -d --name qa-audio-nats -p 127.0.0.1:4222:4222 nats:2.10-alpine -js -sd /data
          python - <<'PY'
          import socket,time
          for i in range(30):
              try:
                  with socket.create_connection(('127.0.0.1',4222),timeout=1) as sock:
                      if sock.recv(1024).startswith(b'INFO '):
                          break
              except OSError:
                  pass
              time.sleep(1)
          else:
              raise SystemExit('NATS unavailable')
          PY
      - name: Actual media jobs through PostgreSQL worker and NATS; no skips
        run: |
          PYTHONPATH=. python -W error::ResourceWarning - <<'PY'
          import gc, sys, unittest
          errors = []
          sys.unraisablehook = lambda e: errors.append(type(e.exc_value).__name__)
          result = unittest.TextTestRunner(verbosity=2).run(
              unittest.defaultTestLoader.discover('tests', pattern='test_audio_jobs_live.py'))
          gc.collect()
          if not result.wasSuccessful() or result.skipped or errors or result.testsRun != 3:
              raise SystemExit('Incomplete real audio pipeline validation')
          PY
      - name: Cleanup dedicated broker
        if: always()
        run: docker rm -f qa-audio-nats
