name: Rejection review dashboard acceptance
on:
  pull_request:
  push:
    branches: ['feat/rejection-review-dashboard']
permissions:
  contents: read
jobs:
  unit-http:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Behavioural review HTTP and metadata checks, no skips
        run: |
          PYTHONPATH=. python -W error::ResourceWarning - <<'PY'
          import gc, sys, unittest
          errors = []
          sys.unraisablehook = lambda e: errors.append(type(e.exc_value).__name__)
          result = unittest.TextTestRunner(verbosity=2).run(
              unittest.defaultTestLoader.discover('tests', pattern='test_rejection_review.py'))
          gc.collect()
          if not result.wasSuccessful() or result.skipped or errors or result.testsRun != 35:
              raise SystemExit('Incomplete review validation: ' + repr(errors))
          PY
  postgres-review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: ci-only-disposable
          POSTGRES_DB: qa_review_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qa -d qa_review_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      QA_TEST_POSTGRES_DSN: postgresql://qa:ci-only-disposable@127.0.0.1:5432/qa_review_test
      QA_REJECTION_REVIEW_LIVE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'psycopg[binary]>=3,<4'
      - name: Real audit records, read-only transactions and HTTP, no skips
        run: |
          PYTHONPATH=. python -W error::ResourceWarning - <<'PY'
          import gc, sys, unittest
          errors = []
          sys.unraisablehook = lambda e: errors.append(type(e.exc_value).__name__)
          result = unittest.TextTestRunner(verbosity=2).run(
              unittest.defaultTestLoader.discover('tests', pattern='test_rejection_review_live.py'))
          gc.collect()
          if not result.wasSuccessful() or result.skipped or errors or result.testsRun != 5:
              raise SystemExit('Incomplete live review validation: ' + repr(errors))
          PY
