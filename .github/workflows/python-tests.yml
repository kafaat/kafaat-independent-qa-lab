name: Python regression
on:
  push:
    branches: [main, 'experiments/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test strict resource warnings
        run: PYTHONPATH=. python -W error::ResourceWarning -m unittest discover -s tests -p 'test_connection.py' -v
