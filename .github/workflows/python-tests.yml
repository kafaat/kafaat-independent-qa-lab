name: Python regression
on:
  push:
    branches: [main, 'experiments/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Intentional negative governance check
        run: |
          echo "Intentionally failing to verify required-check merge blocking."
          exit 1
      - name: SQLite lifecycle smoke
        run: PYTHONPATH=. python -W error::ResourceWarning -m unittest discover -s tests -p 'test_connection.py' -v
      - name: Require complete application before full acceptance
        run: |
          python - <<'PY'
          import pathlib
          required = ('qa_lab/core.py', 'qa_lab/worker.py', 'qa_lab/api.py')
          missing = [p for p in required if not pathlib.Path(p).is_file()]
          if missing:
              raise SystemExit('BLOCKED: application source not yet uploaded: ' + ', '.join(missing))
          PY
      - name: Full regression suite
        run: PYTHONPATH=. python -W error::ResourceWarning -m unittest discover -s tests -v
