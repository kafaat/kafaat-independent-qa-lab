name: NATS JetStream live integration
on:
  push:
    branches: ['feat/postgres-worker-integration']
  pull_request:
permissions:
  contents: read
jobs:
  jetstream:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: qa-ci-only
          POSTGRES_DB: qa_lab_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qa -d qa_lab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      nats:
        image: nats:2.10-alpine
        ports: ['4222:4222']
        options: >-
          --entrypoint /nats-server
          --js
    env:
      QA_TEST_POSTGRES_DSN: postgresql://qa:qa-ci-only@127.0.0.1:5432/qa_lab_test
      QA_NATS_URL: nats://127.0.0.1:4222
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]>=3,<4' 'nats-py>=2.7,<3'
      - name: Run real JetStream publish and redelivery tests
        run: PYTHONPATH=. python -W error::ResourceWarning -m unittest discover -s tests -p 'test_nats_live.py' -v
