name: PostgreSQL Docker stack validation
on:
  push:
    branches: ['feat/postgres-worker-integration']
  pull_request:
permissions:
  contents: read
jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose config
        env:
          QA_POSTGRES_PASSWORD: ci-only-not-production
          QA_API_TOKEN: ci-only-placeholder-not-production
        run: docker compose -f compose.postgres.yaml config --quiet
      - name: Build PostgreSQL application image
        run: docker build -f Dockerfile.pg -t independent-qa-lab:ci .
      - name: Verify API and worker modules import
        run: |
          docker run --rm independent-qa-lab:ci python -c 'import qa_lab.pg_api, qa_lab.pg_worker, qa_lab.pg_queue'
