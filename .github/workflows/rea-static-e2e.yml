name: QA REA static JavaScript experimental E2E
on:
  pull_request:
    paths:
      - 'experiments/rea-offline-e2e/**'
      - '.github/workflows/rea-static-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readback-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s experiments/rea-offline-e2e -p 'test_*.py' -v

  static-rea-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install exact REA CLI version without npm lifecycle hooks
        run: |
          docker build --pull --tag qa-rea-static:6.8.0 \
            -f experiments/rea-offline-e2e/Dockerfile \
            experiments/rea-offline-e2e
      - name: Execute REA on synthetic JS with no runtime network or secrets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rea-e2e"
          name="qa-rea-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || :' EXIT
          set +e
          timeout -k 10s 120s docker run --rm --pull=never --name "$name" \
            --network=none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges --pids-limit=96 \
            --memory=768m --cpus=1 --user=65534:65534 \
            --tmpfs=/tmp:rw,nosuid,nodev,size=64m --env=HOME=/tmp \
            --mount "type=bind,source=$PWD/experiments/rea-offline-e2e/fixtures/app,target=/work,readonly" \
            qa-rea-static:6.8.0 analyze-javascript-application /work --json \
            > "$RUNNER_TEMP/rea-e2e/analysis.json"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "REA process failed with exit status $status; bounded JSON diagnostic:"
            python - <<'PY'
          import json, os
          from pathlib import Path
          f = Path(os.environ['RUNNER_TEMP'])/'rea-e2e'/'analysis.json'
          raw = f.read_bytes()[:4096]
          try:
              data = json.loads(raw)
              if isinstance(data, dict):
                  print(json.dumps({k: str(data.get(k,''))[:300] for k in
                                    ('status','error','message','code','reason')}, sort_keys=True))
              else:
                  print('non-object diagnostic')
          except (ValueError, UnicodeError):
              print('non-JSON diagnostic: ' + repr(raw[:600]))
          PY
            exit "$status"
          fi
          IMAGE_ID=$(docker image inspect --format '{{.Id}}' qa-rea-static:6.8.0)
          python experiments/rea-offline-e2e/verify_rea.py \
            --analysis "$RUNNER_TEMP/rea-e2e/analysis.json" \
            --fixture experiments/rea-offline-e2e/fixtures/app \
            --image-digest "$IMAGE_ID" \
            --source-sha "$(git rev-parse HEAD)" \
            --out "$RUNNER_TEMP/rea-e2e/receipt.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"])/"rea-e2e"/"receipt.json"
          record=json.loads(p.read_text())
          assert record["status"]=="OBSERVED_FOR_REVIEW"
          assert record["production_accepted"] is False
          assert record["provider_bridges_used"] is False
          assert record["network_enabled"] is False
          print(json.dumps({"status": record["status"], "analysis_sha256": record["analysis_sha256"],
                            "tool_version": record["rea_version"],
                            "source_sha":record["source_sha"]}, sort_keys=True))
          PY
