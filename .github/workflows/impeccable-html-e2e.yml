name: QA Impeccable HTML detector experimental E2E
on:
  pull_request:
    paths:
      - 'experiments/impeccable-ui-e2e/**'
      - '.github/workflows/impeccable-html-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s experiments/impeccable-ui-e2e -p 'test_*.py' -v
  real-source-detector:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Impeccable 4.8.0 and optional native detector without scripts
        run: |
          docker build --pull --tag qa-impeccable:4.8.0 \
            -f experiments/impeccable-ui-e2e/Dockerfile \
            experiments/impeccable-ui-e2e
      - name: Scan known broken and corrected HTML with restricted source-only detector
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/impeccable"
          name="qa-design-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || :' EXIT
          for version in baseline candidate; do
            set +e
            timeout -k 10s 90s docker run --rm --pull=never --name "$name" \
              --network=none --read-only --cap-drop=ALL \
              --security-opt=no-new-privileges --pids-limit=64 \
              --memory=512m --cpus=1 --user=65534:65534 \
              --tmpfs=/tmp:rw,nosuid,nodev,size=32m --env=HOME=/tmp \
              --mount "type=bind,source=$PWD/experiments/impeccable-ui-e2e/fixtures/$version,target=/work,readonly" \
              qa-impeccable:4.8.0 detect --json --no-config --no-advisory /work/index.html \
              > "$RUNNER_TEMP/impeccable/$version.json" \
              2> "$RUNNER_TEMP/impeccable/$version.stderr"
            exit_code=$?
            set -e
            echo "$exit_code" > "$RUNNER_TEMP/impeccable/$version.exit"
            if [ "$exit_code" -ne 0 ] && [ "$exit_code" -ne 2 ]; then
              echo "Impeccable detector execution error ($version); bounded diagnostics:"
              head -c 800 "$RUNNER_TEMP/impeccable/$version.stderr"
              head -c 800 "$RUNNER_TEMP/impeccable/$version.json"
              exit 1
            fi
          done
          IMAGE_ID=$(docker image inspect --format '{{.Id}}' qa-impeccable:4.8.0)
          python experiments/impeccable-ui-e2e/verify_ui.py \
            --baseline-json "$RUNNER_TEMP/impeccable/baseline.json" \
            --candidate-json "$RUNNER_TEMP/impeccable/candidate.json" \
            --baseline-html experiments/impeccable-ui-e2e/fixtures/baseline/index.html \
            --candidate-html experiments/impeccable-ui-e2e/fixtures/candidate/index.html \
            --baseline-exit "$(cat "$RUNNER_TEMP/impeccable/baseline.exit")" \
            --candidate-exit "$(cat "$RUNNER_TEMP/impeccable/candidate.exit")" \
            --image-digest "$IMAGE_ID" --source-sha "$(git rev-parse HEAD)" \
            --out "$RUNNER_TEMP/impeccable/review.json"
