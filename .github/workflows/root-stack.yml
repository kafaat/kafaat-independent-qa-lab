name: Root SQLite Compose acceptance
on:
  pull_request:
  push:
    branches: [main, 'fix/root-sqlite-startup/**']
permissions:
  contents: read
jobs:
  root-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      QA_ROOT_STACK_OPT_IN: isolated-ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: SQLite and actual HTTP reader regressions
        run: python -W error::ResourceWarning -m unittest discover -s tests -p 'test_root_stack*.py' -v
      - name: Fresh root-stack build, lifecycle and read-only mount acceptance
        id: live
        run: python scripts/verify_root_stack.py --output "$RUNNER_TEMP/root-stack/receipt.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() && steps.live.outcome != 'skipped' }}
        with:
          name: root-stack-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/root-stack/receipt.json
          if-no-files-found: error
          retention-days: 14
