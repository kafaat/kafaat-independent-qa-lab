name: Required CI gate
on:
  pull_request:
permissions:
  contents: read
  checks: read
concurrency:
  group: ci-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  ci-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Require every pull-request check on the head commit to succeed
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: python -I tools/ci/required_checks_gate.py --sha "$GATE_SHA"
