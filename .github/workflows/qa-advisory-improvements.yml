name: QA advisory improvements
on:
  pull_request:
    paths:
      - 'qa_lab/reliability_policy.py'
      - 'qa_lab/cost_accounting.py'
      - 'qa_lab/parity_inventory.py'
      - 'tests/test_qa_improvements.py'
      - '.github/workflows/qa-advisory-improvements.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  advisory-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile qa_lab/reliability_policy.py qa_lab/cost_accounting.py qa_lab/parity_inventory.py tests/test_qa_improvements.py
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_qa_improvements.py' -v
