name: Public bootstrap checks
on:
  push:
    branches: [main, 'experiments/**']
  pull_request:
permissions:
  contents: read
jobs:
  boundary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check boundary document
        run: test -s docs/BOUNDARY.md
